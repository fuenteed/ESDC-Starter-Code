; ESDC Embedded Programming Group -- Starter Blinky
;
; Open this project, pick the environment that matches YOUR board from the
; list below (use the PlatformIO sidebar's project-task dropdown, or the
; status bar at the bottom of VS Code), then press Build, then Upload.
; See the top-level README's board table if you're not sure which
; environment is yours.
;
; Environments:
;   nucleo_l476rg          -- ST Nucleo-L476RG, onboard ST-LINK
;   nucleo_f446re          -- ST Nucleo-F446RE, onboard ST-LINK
;   bluepill               -- Blue Pill (STM32F103C8), external ST-LINK dongle
;   blackpill_f411_stlink  -- Black Pill (STM32F411CE), via ST-LINK dongle
;   blackpill_f411_dfu     -- Black Pill (STM32F411CE), via USB DFU bootloader
;   blackpill_f401_stlink  -- Black Pill (STM32F401CC), via ST-LINK dongle
;   blackpill_f401_dfu     -- Black Pill (STM32F401CC), via USB DFU bootloader

[env]
; Pinned so every attendee's toolchain behaves identically.
platform = ststm32@20.0.0
framework = arduino

[env:nucleo_l476rg]
board = nucleo_l476rg
upload_protocol = stlink

[env:nucleo_f446re]
board = nucleo_f446re
upload_protocol = stlink

[env:bluepill]
board = bluepill_f103c8
upload_protocol = stlink
; Many clone chips (CKS32/CS32/APM32) report a different SWD IDCODE than a
; genuine STM32F103, and OpenOCD's target script refuses to attach unless
; the ID matches. Setting CPUTAPID to 0 tells OpenOCD to skip that check
; entirely, so this works for both genuine ST chips and clones without
; needing to know which one you have.
; upload_flags is prepended ahead of the platform's own OpenOCD args, so
; this "set" command runs before target/stm32f1x.cfg is loaded -- which is
; required for it to take effect.
upload_flags =
    -c
    set CPUTAPID 0

[env:blackpill_f411_stlink]
board = blackpill_f411ce
upload_protocol = stlink

[env:blackpill_f411_dfu]
board = blackpill_f411ce
upload_protocol = dfu

[env:blackpill_f401_stlink]
board = blackpill_f401cc
upload_protocol = stlink

[env:blackpill_f401_dfu]
board = blackpill_f401cc
upload_protocol = dfu
