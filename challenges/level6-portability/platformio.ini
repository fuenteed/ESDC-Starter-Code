; ESDC Embedded Programming Group -- Challenge Level 6: Portability
; Two environments this time: an F4 board (working reference) and the
; Blue Pill (your porting target).

[env]
platform = ststm32@20.0.0
framework = stm32cube

[env:blackpill_f411_stlink]
board = blackpill_f411ce
upload_protocol = stlink
build_src_filter = +<f4_main.c> -<f1_main.c>

[env:bluepill]
board = bluepill_f103c8
upload_protocol = stlink
; See blinky/platformio.ini for why this is needed on clone chips.
upload_flags =
    -c
    set CPUTAPID 0
build_src_filter = +<f1_main.c> -<f4_main.c>
