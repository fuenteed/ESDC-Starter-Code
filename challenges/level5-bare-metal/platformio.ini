; ESDC Embedded Programming Group -- Challenge Level 5: Bare-metal blinky
; Pick your board's environment below, then Build/Upload as usual.
;
; No framework at all -- raw register addresses are #defined at the top of
; each source file. We only use PlatformIO's bundled startup code/linker
; script (via "framework = stm32cube", but note we never call any HAL_*
; functions or even include the device header).
;
; Three source files, one per register-layout family:
;   f4_main.c  -- Nucleo-F446RE, Black Pill F411/F401 (MODER/AHB1ENR)
;   l4_main.c  -- Nucleo-L476RG                        (MODER/AHB2ENR)
;   f1_main.c  -- Blue Pill                             (CRL/CRH/APB2ENR)
; build_src_filter below picks the right one per environment.

[env]
platform = ststm32@20.0.0
framework = stm32cube

[env:nucleo_l476rg]
board = nucleo_l476rg
upload_protocol = stlink
build_src_filter = +<l4_main.c> -<f4_main.c> -<f1_main.c>

[env:nucleo_f446re]
board = nucleo_f446re
upload_protocol = stlink
build_src_filter = +<f4_main.c> -<l4_main.c> -<f1_main.c>

[env:bluepill]
board = bluepill_f103c8
upload_protocol = stlink
; See blinky/platformio.ini for why this is needed on clone chips.
upload_flags =
    -c
    set CPUTAPID 0
build_src_filter = +<f1_main.c> -<f4_main.c> -<l4_main.c>

[env:blackpill_f411_stlink]
board = blackpill_f411ce
upload_protocol = stlink
build_src_filter = +<f4_main.c> -<l4_main.c> -<f1_main.c>

[env:blackpill_f411_dfu]
board = blackpill_f411ce
upload_protocol = dfu
build_src_filter = +<f4_main.c> -<l4_main.c> -<f1_main.c>

[env:blackpill_f401_stlink]
board = blackpill_f401cc
upload_protocol = stlink
build_src_filter = +<f4_main.c> -<l4_main.c> -<f1_main.c>

[env:blackpill_f401_dfu]
board = blackpill_f401cc
upload_protocol = dfu
build_src_filter = +<f4_main.c> -<l4_main.c> -<f1_main.c>
