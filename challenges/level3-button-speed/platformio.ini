; ESDC Embedded Programming Group -- Challenge Level 3: Button Speed
; Pick your board's environment below, then Build/Upload as usual.
;
; NOTE: no Blue Pill environment here -- the Blue Pill has no onboard user
; button (only a reset button), so this challenge isn't buildable/testable
; for it out of the box. See the README for details.

[env]
platform = ststm32@20.0.0
framework = arduino

[env:nucleo_l476rg]
board = nucleo_l476rg
upload_protocol = stlink

[env:nucleo_f446re]
board = nucleo_f446re
upload_protocol = stlink

[env:blackpill_f411_stlink]
board = blackpill_f411ce
upload_protocol = stlink

[env:blackpill_f411_dfu]
board = blackpill_f411ce
upload_protocol = dfu

[env:blackpill_f401_stlink]
board = blackpill_f401cc
upload_protocol = stlink

[env:blackpill_f401_dfu]
board = blackpill_f401cc
upload_protocol = dfu
