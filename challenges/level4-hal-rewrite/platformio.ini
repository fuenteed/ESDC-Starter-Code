; ESDC Embedded Programming Group -- Challenge Level 4: STM32Cube HAL rewrite
; Pick your board's environment below, then Build/Upload as usual.
;
; No "framework = arduino" here -- this challenge is about using ST's
; STM32Cube HAL library directly, with no Arduino layer underneath.
; LED_PORT/LED_PIN/LED_CLK_ENABLE are passed in per-environment below so
; the same src/main.c works unchanged on every board.

[env]
platform = ststm32@20.0.0
framework = stm32cube

[env:nucleo_l476rg]
board = nucleo_l476rg
upload_protocol = stlink
build_flags = -DLED_PORT=GPIOA -DLED_PIN=GPIO_PIN_5 -DLED_CLK_ENABLE=__HAL_RCC_GPIOA_CLK_ENABLE

[env:nucleo_f446re]
board = nucleo_f446re
upload_protocol = stlink
build_flags = -DLED_PORT=GPIOA -DLED_PIN=GPIO_PIN_5 -DLED_CLK_ENABLE=__HAL_RCC_GPIOA_CLK_ENABLE

[env:bluepill]
board = bluepill_f103c8
upload_protocol = stlink
; See blinky/platformio.ini for why this is needed on clone chips.
upload_flags =
    -c
    set CPUTAPID 0
build_flags = -DLED_PORT=GPIOC -DLED_PIN=GPIO_PIN_13 -DLED_CLK_ENABLE=__HAL_RCC_GPIOC_CLK_ENABLE

[env:blackpill_f411_stlink]
board = blackpill_f411ce
upload_protocol = stlink
build_flags = -DLED_PORT=GPIOC -DLED_PIN=GPIO_PIN_13 -DLED_CLK_ENABLE=__HAL_RCC_GPIOC_CLK_ENABLE

[env:blackpill_f411_dfu]
board = blackpill_f411ce
upload_protocol = dfu
build_flags = -DLED_PORT=GPIOC -DLED_PIN=GPIO_PIN_13 -DLED_CLK_ENABLE=__HAL_RCC_GPIOC_CLK_ENABLE

[env:blackpill_f401_stlink]
board = blackpill_f401cc
upload_protocol = stlink
build_flags = -DLED_PORT=GPIOC -DLED_PIN=GPIO_PIN_13 -DLED_CLK_ENABLE=__HAL_RCC_GPIOC_CLK_ENABLE

[env:blackpill_f401_dfu]
board = blackpill_f401cc
upload_protocol = dfu
build_flags = -DLED_PORT=GPIOC -DLED_PIN=GPIO_PIN_13 -DLED_CLK_ENABLE=__HAL_RCC_GPIOC_CLK_ENABLE
